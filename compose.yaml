services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: jive, POSTGRES_PASSWORD: jive, POSTGRES_DB: jive }
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U jive'], interval: 5s, timeout: 3s, retries: 10 }
  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lfu']
    ports: ['6379:6379']
  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6380:6379']
    volumes: ['queue-data:/data']
  migrate:
    build: .
    command: ['node', 'dist/packages/database/src/migrate.js']
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: .
    command: ['node', 'dist/apps/api/src/main.js']
    env_file: .env
    ports: ['3000:3000']
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis-cache: { condition: service_started },
        redis-queue: { condition: service_started },
      }
    healthcheck:
      {
        test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3000/health/live'],
        interval: 10s,
        timeout: 3s,
        retries: 5,
      }
  worker:
    build: .
    command: ['node', 'dist/apps/worker/src/main.js']
    env_file: .env
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis-cache: { condition: service_started },
        redis-queue: { condition: service_started },
      }
volumes:
  postgres-data:
  queue-data:
