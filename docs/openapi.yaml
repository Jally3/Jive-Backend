openapi: 3.1.0
info:
  title: Jive Backend API
  version: 1.0.0
  description: Catalog snapshots and personalized recommendation APIs for Jive clients.
servers:
  - url: https://hey-rickytse.com
    description: Production
tags:
  - name: Catalog
  - name: Manifest
  - name: Health
  - name: Recommendations
paths:
  /api/v1/recommendations/anonymous-subject:
    post:
      tags: [Recommendations]
      summary: Issue a signed anonymous recommendation subject
      operationId: issueAnonymousRecommendationSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Anonymous subject issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousSubject'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RecommendationError'
  /api/v1/recommendations/personalized:
    post:
      tags: [Recommendations]
      summary: Create or continue a personalized recommendation session
      operationId: getPersonalizedRecommendations
      parameters:
        - $ref: '#/components/parameters/AnonymousSubjectHeader'
        - $ref: '#/components/parameters/RecommendationAcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/InitialRecommendationRequest'
                - $ref: '#/components/schemas/NextRecommendationRequest'
      responses:
        '200':
          description: Personalized page or cold-start result.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResult'
            application/x-ndjson:
              schema:
                type: string
              x-ndjson-item-schema:
                $ref: '#/components/schemas/RecommendationStreamEvent'
              description: |
                Newline-delimited RecommendationStreamEvent objects. The sequence is start,
                zero or more item events, then done. Once streaming has started, failures are
                represented by a terminal error event because the HTTP status is already 200.
        '400':
          $ref: '#/components/responses/RecommendationError'
        '401':
          $ref: '#/components/responses/RecommendationError'
        '410':
          $ref: '#/components/responses/RecommendationError'
        '413':
          $ref: '#/components/responses/RecommendationError'
        '429':
          $ref: '#/components/responses/RecommendationError'
        '502':
          $ref: '#/components/responses/RecommendationError'
        '503':
          $ref: '#/components/responses/RecommendationError'
        '504':
          $ref: '#/components/responses/RecommendationError'
  /api/v1/recommendations/events:
    post:
      tags: [Recommendations]
      summary: Record a privacy-minimized recommendation matching event
      operationId: recordRecommendationEvent
      parameters:
        - $ref: '#/components/parameters/AnonymousSubjectHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationEvent'
      responses:
        '204':
          description: Event accepted.
        '400':
          $ref: '#/components/responses/RecommendationError'
        '401':
          $ref: '#/components/responses/RecommendationError'
        '429':
          $ref: '#/components/responses/RecommendationError'
        '503':
          $ref: '#/components/responses/RecommendationError'
  /api/tmdb/v1/catalog:
    get:
      tags: [Catalog]
      summary: Get a catalog snapshot
      operationId: getCatalog
      parameters:
        - name: feed
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/FeedName'
        - name: If-None-Match
          in: header
          required: false
          description: ETag returned by a previous request.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/CatalogSuccess'
        '304':
          description: Snapshot unchanged; response has no body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tmdb/v1/manifest:
    get:
      tags: [Manifest]
      summary: Get available feed revisions
      operationId: getManifest
      responses:
        '200':
          $ref: '#/components/responses/ManifestSuccess'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /data/tmdb/v1/latest.json:
    get:
      tags: [Catalog]
      summary: Get latest snapshot using the compatibility URL
      operationId: getLatestJson
      responses:
        '200':
          $ref: '#/components/responses/CatalogSuccess'
        '304':
          description: Snapshot unchanged; response has no body.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /data/tmdb/v1/popular.json:
    get:
      tags: [Catalog]
      summary: Get popular snapshot using the compatibility URL
      operationId: getPopularJson
      responses:
        '200':
          $ref: '#/components/responses/CatalogSuccess'
        '304':
          description: Snapshot unchanged; response has no body.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /data/tmdb/v1/top-rated.json:
    get:
      tags: [Catalog]
      summary: Get top-rated snapshot using the compatibility URL
      operationId: getTopRatedJson
      responses:
        '200':
          $ref: '#/components/responses/CatalogSuccess'
        '304':
          description: Snapshot unchanged; response has no body.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /data/tmdb/v1/manifest.json:
    get:
      tags: [Manifest]
      summary: Get manifest using the compatibility URL
      operationId: getManifestJson
      responses:
        '200':
          $ref: '#/components/responses/ManifestSuccess'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      tags: [Health]
      summary: Check whether the process is alive
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      tags: [Health]
      summary: Check whether all feeds are available
      operationId: getReadiness
      responses:
        '200':
          description: All feeds are available; one or more may be stale.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: At least one feed is missing.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
components:
  parameters:
    AnonymousSubjectHeader:
      name: X-Jive-Anonymous-Subject
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    RecommendationAcceptHeader:
      name: Accept
      in: header
      required: false
      description: Use application/x-ndjson for incremental recommendation events.
      schema:
        type: string
        enum: [application/json, application/x-ndjson]
        default: application/json
  headers:
    RequestId:
      description: Unique identifier for this request.
      schema:
        type: string
        pattern: '^req_[0-9a-f-]+$'
    ETag:
      description: Revision-based entity tag for conditional requests.
      schema:
        type: string
    CatalogRevision:
      description: Revision of the returned catalog snapshot.
      schema:
        type: string
    CatalogStale:
      description: Whether the returned snapshot is stale.
      schema:
        type: string
        enum: ['true', 'false']
  responses:
    CatalogSuccess:
      description: Catalog snapshot.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
        X-Catalog-Revision:
          $ref: '#/components/headers/CatalogRevision'
        X-Catalog-Stale:
          $ref: '#/components/headers/CatalogStale'
        Cache-Control:
          description: Public caching policy.
          schema:
            type: string
            example: public, max-age=300, stale-while-revalidate=3600
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogSnapshot'
    ManifestSuccess:
      description: Available feed revisions.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          description: Public caching policy.
          schema:
            type: string
            example: public, max-age=60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Manifest'
    InvalidArgument:
      description: Missing or unsupported feed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Request limit exceeded.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Minimum retry delay in seconds.
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CatalogUnavailable:
      description: Feed is not available or has exceeded its retention window.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server error.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RecommendationError:
      description: Structured recommendation error.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecommendationErrorEnvelope'
  schemas:
    AnonymousSubject:
      type: object
      additionalProperties: false
      required: [anonymousSubjectId, issuedAt]
      properties:
        anonymousSubjectId: { type: string }
        issuedAt: { type: string, format: date-time }
    RecommendationHistory:
      type: object
      required: [title, progress, completed, watchedAt]
      properties:
        title: { type: string, maxLength: 100 }
        year: { type: string, maxLength: 4 }
        category: { type: string, maxLength: 50 }
        episodeName: { type: string, maxLength: 50 }
        progress: { type: number, minimum: 0, maximum: 1 }
        completed: { type: boolean }
        watchedAt: { type: string, format: date-time }
    RecommendationLibraryItem:
      type: object
      required: [title, favorite, following, updatedAt]
      properties:
        title: { type: string, maxLength: 100 }
        year: { type: string, maxLength: 4 }
        category: { type: string, maxLength: 50 }
        favorite: { type: boolean }
        following: { type: boolean }
        updatedAt: { type: string, format: date-time }
    InitialRecommendationRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, format: uuid, maxLength: 64 }
        locale: { type: string, default: zh-CN, maxLength: 20 }
        pageSize: { type: integer, minimum: 12, maximum: 24, default: 24 }
        history:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RecommendationHistory' }
        library:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/RecommendationLibraryItem' }
    NextRecommendationRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, cursor]
      properties:
        clientRequestId: { type: string, format: uuid, maxLength: 64 }
        cursor: { type: string, maxLength: 1024 }
    RecommendationCandidate:
      type: object
      required:
        [
          title,
          originalTitle,
          aliases,
          year,
          mediaType,
          category,
          latestSeasonNumber,
          modelConfidence,
          reason,
        ]
      properties:
        title: { type: string }
        originalTitle: { type: string }
        aliases: { type: array, items: { type: string }, maxItems: 3 }
        year: { type: string }
        mediaType: { type: string, enum: [movie, tv] }
        category: { type: string, enum: [movie, tv, animation, variety] }
        latestSeasonNumber: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        modelConfidence: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
    RecommendationResult:
      oneOf:
        - $ref: '#/components/schemas/PersonalizedRecommendationResult'
        - $ref: '#/components/schemas/ColdStartRecommendationResult'
    RecommendationPage:
      type: object
      additionalProperties: false
      required: [index, pageSize, hasMore, nextCursor]
      properties:
        index: { type: integer, minimum: 1, maximum: 3 }
        pageSize: { type: integer, minimum: 12, maximum: 24 }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'], maxLength: 1024 }
    PersonalizedRecommendationMeta:
      type: object
      additionalProperties: false
      required:
        [
          requested,
          llmReturned,
          validAfterSchema,
          duplicatesRemovedInPage,
          duplicatesRemovedInSession,
          returned,
          cache,
        ]
      properties:
        requested: { type: integer, minimum: 0 }
        llmReturned: { type: integer, minimum: 0 }
        validAfterSchema: { type: integer, minimum: 0 }
        duplicatesRemovedInPage: { type: integer, minimum: 0 }
        duplicatesRemovedInSession: { type: integer, minimum: 0 }
        returned: { type: integer, minimum: 0 }
        cache: { type: string, enum: [miss, fresh, stale, cursor_replay] }
    ColdStartRecommendationMeta:
      type: object
      additionalProperties: false
      required: [reason, llmCalled, cache]
      properties:
        reason: { type: string, const: insufficient_preference_signals }
        llmCalled: { type: boolean, const: false }
        cache: { type: string, const: miss }
    PersonalizedRecommendationResult:
      type: object
      additionalProperties: false
      required:
        [
          requestId,
          clientRequestId,
          generatedAt,
          servedAt,
          expiresAt,
          sessionId,
          source,
          mode,
          items,
          page,
          meta,
        ]
      properties:
        requestId: { type: string }
        clientRequestId: { type: string }
        generatedAt: { type: string, format: date-time }
        servedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        sessionId: { type: string }
        source: { type: string, const: llm }
        mode: { type: string, const: personalized }
        items: { type: array, items: { $ref: '#/components/schemas/RecommendationCandidate' } }
        page: { $ref: '#/components/schemas/RecommendationPage' }
        meta: { $ref: '#/components/schemas/PersonalizedRecommendationMeta' }
    ColdStartRecommendationResult:
      type: object
      additionalProperties: false
      required: [requestId, clientRequestId, servedAt, source, mode, items, page, meta]
      properties:
        requestId: { type: string }
        clientRequestId: { type: string }
        servedAt: { type: string, format: date-time }
        source: { type: string, const: none }
        mode: { type: string, const: cold_start }
        items: { type: array, maxItems: 0 }
        page: { $ref: '#/components/schemas/RecommendationPage' }
        meta: { $ref: '#/components/schemas/ColdStartRecommendationMeta' }
    RecommendationStreamStart:
      type: object
      additionalProperties: false
      required: [type, requestId, clientRequestId, mode, source]
      properties:
        type: { type: string, const: start }
        requestId: { type: string }
        clientRequestId: { type: string, format: uuid }
        mode: { type: string, enum: [personalized, cold_start] }
        source: { type: string, enum: [llm, none] }
    RecommendationStreamItem:
      type: object
      additionalProperties: false
      required: [type, index, item]
      properties:
        type: { type: string, const: item }
        index: { type: integer, minimum: 1, maximum: 24 }
        item: { $ref: '#/components/schemas/RecommendationCandidate' }
    RecommendationStreamDone:
      type: object
      additionalProperties: false
      required: [type, result]
      properties:
        type: { type: string, const: done }
        result: { $ref: '#/components/schemas/RecommendationResult' }
    RecommendationStreamError:
      type: object
      additionalProperties: false
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error: { $ref: '#/components/schemas/RecommendationErrorDetails' }
    RecommendationStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/RecommendationStreamStart'
        - $ref: '#/components/schemas/RecommendationStreamItem'
        - $ref: '#/components/schemas/RecommendationStreamDone'
        - $ref: '#/components/schemas/RecommendationStreamError'
      discriminator:
        propertyName: type
        mapping:
          start: '#/components/schemas/RecommendationStreamStart'
          item: '#/components/schemas/RecommendationStreamItem'
          done: '#/components/schemas/RecommendationStreamDone'
          error: '#/components/schemas/RecommendationStreamError'
    RecommendationEvent:
      type: object
      additionalProperties: false
      required: [clientRequestId, sessionId, pageIndex, candidatePosition, event, occurredAt]
      properties:
        clientRequestId: { type: string, format: uuid }
        sessionId: { type: string }
        pageIndex: { type: integer, minimum: 1, maximum: 3 }
        candidatePosition: { type: integer, minimum: 1, maximum: 24 }
        event:
          type: string
          enum:
            [
              candidate_exposed,
              vod_matched,
              vod_not_found,
              vod_ambiguous,
              vod_search_failed,
              manual_search_opened,
              source_switch_opened,
              manual_playable_found,
            ]
        occurredAt: { type: string, format: date-time }
    RecommendationErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/RecommendationErrorDetails' }
    RecommendationErrorDetails:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code:
          type: string
          enum:
            - INVALID_RECOMMENDATION_INPUT
            - INVALID_RECOMMENDATION_CURSOR
            - INVALID_ANONYMOUS_SUBJECT
            - RECOMMENDATION_CURSOR_EXPIRED
            - RECOMMENDATION_PAYLOAD_TOO_LARGE
            - RECOMMENDATION_RATE_LIMITED
            - RECOMMENDATION_SUBJECT_BUDGET_EXHAUSTED
            - RECOMMENDATION_INVALID_RESPONSE
            - RECOMMENDATION_DISABLED
            - RECOMMENDATION_CAPACITY_EXCEEDED
            - RECOMMENDATION_GLOBAL_BUDGET_EXHAUSTED
            - RECOMMENDATION_BUDGET_STATE_UNAVAILABLE
            - RECOMMENDATION_UPSTREAM_RATE_LIMITED
            - RECOMMENDATION_UPSTREAM_UNAVAILABLE
            - RECOMMENDATION_UPSTREAM_TIMEOUT
        message: { type: string }
        requestId: { type: string }
        clientRequestId: { type: string, format: uuid }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 1 }
    FeedName:
      type: string
      enum: [latest, popular, top_rated]
    MediaType:
      type: string
      enum: [movie, tv]
    Category:
      type: string
      enum: [movie, tv, animation, variety]
    CatalogItem:
      type: object
      additionalProperties: false
      required:
        - tmdbId
        - mediaType
        - category
        - localizedTitle
        - originalTitle
        - aliases
        - releaseDate
        - sortDate
        - rating
        - voteCount
        - popularity
        - posterPath
      properties:
        tmdbId:
          type: integer
          minimum: 1
        mediaType:
          $ref: '#/components/schemas/MediaType'
        category:
          $ref: '#/components/schemas/Category'
        localizedTitle:
          type: string
          minLength: 1
        originalTitle:
          type: string
        originalLanguage:
          type: string
          pattern: '^(|[a-z]{2})$'
          description: Present on newly generated snapshots; legacy snapshots may omit it.
        originCountries:
          type: array
          uniqueItems: true
          description: Present on newly generated snapshots; legacy snapshots may omit it.
          items:
            type: string
            pattern: '^[A-Z]{2}$'
        aliases:
          type: array
          items:
            type: string
        releaseDate:
          type: string
          pattern: '^(|[0-9]{4}-[0-9]{2}-[0-9]{2})$'
        sortDate:
          type: string
          pattern: '^(|[0-9]{4}-[0-9]{2}-[0-9]{2})$'
        latestSeasonNumber:
          type: integer
          minimum: 1
        rating:
          type: number
          minimum: 0
        voteCount:
          type: integer
          minimum: 0
        popularity:
          type: number
          minimum: 0
        posterPath:
          type: string
    CatalogGroups:
      type: object
      additionalProperties: false
      required: [all, movie, tv, animation, variety]
      properties:
        all:
          $ref: '#/components/schemas/ItemIdList'
        movie:
          $ref: '#/components/schemas/ItemIdList'
        tv:
          $ref: '#/components/schemas/ItemIdList'
        animation:
          $ref: '#/components/schemas/ItemIdList'
        variety:
          allOf:
            - $ref: '#/components/schemas/ItemIdList'
          description: Variety shows whose TMDB original language is zh, ja, or ko.
    ItemIdList:
      type: array
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        pattern: '^tmdb:(movie|tv):[1-9][0-9]*$'
    CatalogSnapshot:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - revision
        - feed
        - generatedAt
        - expiresAt
        - stale
        - groups
        - items
      properties:
        schemaVersion:
          type: integer
          const: 1
        revision:
          type: string
          pattern: '^[0-9]{8}T[0-9]{6}Z$'
        feed:
          $ref: '#/components/schemas/FeedName'
        generatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        stale:
          type: boolean
        groups:
          $ref: '#/components/schemas/CatalogGroups'
        items:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CatalogItem'
    FeedManifestEntry:
      type: object
      additionalProperties: false
      required: [revision, generatedAt, expiresAt, stale, path]
      properties:
        revision:
          type: string
          pattern: '^[0-9]{8}T[0-9]{6}Z$'
        generatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        stale:
          type: boolean
        path:
          type: string
          enum: [latest.json, popular.json, top-rated.json]
    ManifestFeeds:
      type: object
      additionalProperties: false
      properties:
        latest:
          $ref: '#/components/schemas/FeedManifestEntry'
        popular:
          $ref: '#/components/schemas/FeedManifestEntry'
        top_rated:
          $ref: '#/components/schemas/FeedManifestEntry'
    Manifest:
      type: object
      additionalProperties: false
      required: [schemaVersion, language, feeds]
      properties:
        schemaVersion:
          type: integer
          const: 1
        language:
          type: string
          const: zh-CN
        feeds:
          $ref: '#/components/schemas/ManifestFeeds'
    FeedReadiness:
      type: string
      enum: [ok, stale, missing]
    ReadinessFeeds:
      type: object
      additionalProperties: false
      required: [latest, popular, top_rated]
      properties:
        latest:
          $ref: '#/components/schemas/FeedReadiness'
        popular:
          $ref: '#/components/schemas/FeedReadiness'
        top_rated:
          $ref: '#/components/schemas/FeedReadiness'
    Readiness:
      type: object
      additionalProperties: false
      required: [ready, status, feeds]
      properties:
        ready:
          type: boolean
        status:
          type: string
          enum: [ok, degraded, unavailable]
        feeds:
          $ref: '#/components/schemas/ReadinessFeeds'
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - INVALID_ARGUMENT
                - METHOD_NOT_ALLOWED
                - NOT_FOUND
                - RATE_LIMITED
                - CATALOG_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
