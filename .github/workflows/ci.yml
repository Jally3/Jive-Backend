name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        {
          image: 'postgres:17-alpine',
          env: { POSTGRES_USER: jive, POSTGRES_PASSWORD: jive, POSTGRES_DB: jive },
          ports: ['5432:5432'],
          options: "--health-cmd 'pg_isready -U jive' --health-interval 5s --health-timeout 3s --health-retries 10",
        }
      redis-cache: { image: 'redis:7-alpine', ports: ['6379:6379'] }
      redis-queue: { image: 'redis:7-alpine', ports: ['6380:6379'] }
    env:
      DATABASE_URL: postgresql://jive:jive@localhost:5432/jive
      CACHE_REDIS_URL: redis://localhost:6379/0
      QUEUE_REDIS_URL: redis://localhost:6380/0
      ADMIN_AUTH_TOKEN: test-admin-token-at-least-32-characters
      INSTALLATION_TOKEN_SECRET: test-installation-secret-at-least-32
      STORM_BASE_URL: https://example.com/api/vod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint && pnpm format:check && pnpm typecheck
      - run: pnpm test && pnpm test:integration && pnpm test:e2e && pnpm build && pnpm openapi:check
      - run: pnpm audit --prod --audit-level high
      - run: docker build .
